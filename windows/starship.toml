# 不在命令之间额外空一行
add_newline = false

# 整体格式
format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$golang\
$rust\
$cmd_duration\
$line_break\
$character"""

# 当前目录
[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = false
read_only = " 󰌾"

# Git 分支
[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

# Git 状态
[git_status]
disabled=true
style = "bold red"
format = "[$all_status$ahead_behind]($style) "
conflicted = "=${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "\\$${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

# Node.js
[nodejs]
symbol = " "
style = "bold green"
format = "[$symbol$version]($style) "
detect_extensions = ["js", "mjs", "cjs", "jsx"]

# Python
[python]
symbol = " "
style = "bold yellow"
format = "[$symbol$version]($style) "

# Go
[golang]
symbol = " "
style = "bold cyan"
format = "[$symbol$version]($style) "

# Rust
[rust]
symbol = " "
style = "bold red"
format = "[$symbol$version]($style) "

# 命令执行耗时
[cmd_duration]
min_time = 500
style = "bold yellow"
format = "took [$duration]($style) "

# 输入符号
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"