# 外观

# 英文界面
language=default
# Fluent 图标风格
icon_theme=fluent
# 黑色 OSC 背景
osc_color=#000000
# 橙色进度条
seekbarfg_color=#FB8C00
# 悬停效果：尺寸+发光+颜色
hover_effect=size,glow,color

# 行为

# 1秒后自动隐藏
hidetimeout=1000
# 仅在靠近控制栏的区域响应（ModernZ v0.3.3 使用相对比例）
deadzonesize=0.88
# 鼠标留在控制栏上时保持显示
keep_with_cursor=yes
# 拖动进度条时暂停
mouse_seek_pause=yes

# 按钮

# 显示跳转按钮
jump_buttons=yes
# 跳转10秒
jump_amount=10
# 播放列表上/下一个
track_nextprev_buttons=yes
# 隐藏字幕切换按钮
subtitles_button=no
# 截图按钮
screenshot_button=yes
# 置顶按钮               
ontop_button=yes
loop_button=no



# 字幕抬升

# OSC显示时自动抬升字幕
sub_margins=yes

# 章节和时间

# 显示章节标题
show_chapter_title=yes
# 显示当前时间 / 总时间
timecurrent=yes
# 动态时间格式（MM:SS或HH:MM:SS）
time_format=dynamic

# 缩略图预览

# 缩略图边框宽度
thumbnail_box_outline_size=3
# 圆角半径
thumbnail_box_radius=3
# 边框颜色
thumbnail_box_outline=#111111
