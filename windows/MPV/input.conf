# ========== 鼠标操作 ==========
MBTN_LEFT_DBL cycle pause           # 双击左键：暂停/播放
MBTN_RIGHT    ignore                # 右键单击：禁用
WHEEL_UP      add volume 2          # 滚轮上：音量+2
WHEEL_DOWN    add volume -2         # 滚轮下：音量-2

# A-B 片段循环
l ab-loop
# ========== 方向键导航 ==========
RIGHT      seek 5                   # 右方向键：快进5秒
LEFT       seek -5                  # 左方向键：快退5秒
UP         add volume 5             # 上方向键：音量+5
DOWN       add volume -5            # 下方向键：音量-5

Shift+RIGHT playlist-next           # 下一个文件
Shift+LEFT  playlist-prev           # 上一个文件

Ctrl+RIGHT  frame-step              # Ctrl+右方向键：前进1帧
Ctrl+LEFT   frame-back-step         # Ctrl+左方向键：后退1帧
Ctrl+WHEEL_UP  frame-step           # Ctrl+滚轮上：前进1帧
Ctrl+WHEEL_DOWN   frame-back-step   # Ctrl+滚轮下：后退1帧



Alt+WHEEL_UP add video-zoom 0.1              # 放大
Alt+WHEEL_DOWN add video-zoom -0.1             # 缩小
Alt+LEFT  add video-pan-x 0.05
Alt+RIGHT add video-pan-x -0.05
Alt+UP    add video-pan-y 0.05
Alt+DOWN  add video-pan-y -0.05
Alt+BS set video-zoom 0; set video-pan-x 0; set video-pan-y 0
# ========== 屏蔽默认数字键 ==========
0 ignore                            # 屏蔽默认音量增加
1 ignore                            # 屏蔽默认对比度降低
2 ignore                            # 屏蔽默认对比度增加
3 ignore                            # 屏蔽默认亮度降低
4 ignore                            # 屏蔽默认亮度增加
5 ignore                            # 屏蔽默认伽马降低
6 ignore                            # 屏蔽默认伽马增加
7 ignore                            # 屏蔽默认饱和度降低
8 ignore                            # 屏蔽默认饱和度增加
9 ignore                            # 屏蔽默认音量降低

# ========== 播放速度控制 ==========
ENTER cycle pause                   # 回车键：暂停/继续播放
[  multiply speed 0.5               # [ 键：速度/2
]  multiply speed 2.0               # ] 键：速度*2
BS set speed 1.0                    # 退格键：重置速度为1.0
# ========== 截图控制 ==========
# s screenshot                       # s键：含字幕截图
# S screenshot video                 # Shift+s键：纯视频截图
# ========== 窗口控制 ==========
f cycle fullscreen                 # f键：切换全屏
t cycle ontop                      # t键：切换窗口置顶
# ========== 字幕控制 ==========
j cycle sub                        # j键：切换主字幕轨道
J cycle sub down                   # Shift+j：反向切换
k cycle secondary-sid              # k键：切换次字幕轨道
K cycle secondary-sid down         # Shift+k：反向切换

# ========== ModernZ OSC控制 ==========
TAB script-binding modernz/visibility  # Tab键：切换OSC显示模式

# Ctrl+1	Mode A (HQ)	    强修复线条 + 高清 upscale	低分辨率、线条模糊的老动漫  (Optimized for 1080p Anime).
# Ctrl+2	Mode B (HQ)	    柔和修复线条 + 高清 upscale	线条较清晰但细节不足的动漫  (Optimized for 720p Anime).
# Ctrl+3	Mode C (HQ)	    降噪 + 高清 upscale	有噪点、颗粒感的视频（如老片压制版） (Optimized for 480p Anime).
# Ctrl+4	Mode A+A (HQ)	双重修复 + 双重 upscale（更强效果）	画质极差的视频（需较强性能）
# Ctrl+5	Mode B+B (HQ)	双重柔和修复 + 双重 upscale	中等画质，希望保留柔和风格同时增强细节
# Ctrl+6	Mode C+A (HQ)	降噪 + 修复 + 双重 upscale	有噪点且线条模糊的视频
# Ctrl+7	真人轻度增强：SSimSuperRes
# Ctrl+8	真人通用超分：FSRCNNX
# Ctrl+9	真人强增强：FSRCNNX + SSimSuperRes
# CTRL+0    关闭

# Optimized shaders for higher-end GPU
CTRL+1 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_VL.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode A (HQ)"
CTRL+2 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_Soft_VL.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode B (HQ)"
CTRL+3 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Upscale_Denoise_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode C (HQ)"
CTRL+4 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_VL.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl;~~/shaders/Anime4K_Restore_CNN_M.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode A+A (HQ)"
CTRL+5 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_Soft_VL.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Restore_CNN_Soft_M.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode B+B (HQ)"
CTRL+6 no-osd change-list glsl-shaders set "~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Upscale_Denoise_CNN_x2_VL.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_AutoDownscalePre_x4.glsl;~~/shaders/Anime4K_Restore_CNN_M.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"; show-text "Anime4K: Mode C+A (HQ)"
CTRL+7 no-osd change-list glsl-shaders set "~~/shaders/SSimSuperRes.glsl"; show-text "Live Action: SSimSuperRes"
CTRL+8 no-osd change-list glsl-shaders set "~~/shaders/FSRCNNX_x2_16-0-4-1.glsl"; show-text "Live Action: FSRCNNX"
CTRL+9 no-osd change-list glsl-shaders set "~~/shaders/FSRCNNX_x2_16-0-4-1.glsl;~~/shaders/SSimSuperRes.glsl"; show-text "Live Action: FSRCNNX + SSimSuperRes"

CTRL+0 no-osd change-list glsl-shaders clr ""; show-text "GLSL shaders cleared"
